[project]
name = "notes-backend"
version = "0.2.6"
description = "Backend of the self-hosted notes app"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "altcha>=2.5.0",
    "argon2-cffi>=25.1.0",
    "authlib>=1.9.8",
    "cryptography>=50.0.2",
    "fastapi>=0.163.1",
    "httpx2>=2.16.2",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyotp>=2.12.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["app", "tests", "alembic"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
